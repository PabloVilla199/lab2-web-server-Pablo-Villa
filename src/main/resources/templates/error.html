<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error <span th:text="${status ?: '404'}">404</span> - Lab2 Web Server</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,-apple-system,sans-serif;background:#f87171;display:flex;align-items:center;justify-content:center;min-height:100vh;}
        .card{background:white;padding:4rem;border-radius:15px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center;max-width:550px;width:90%;}
        .error-code{font-size:8rem;color:#dc2626;font-weight:800;margin-bottom:1rem;}
        .error-title{font-size:1.5rem;color:#1f2937;font-weight:600;margin-bottom:1rem;}
        .error-subtitle{font-size:0.95rem;color:#6b7280;margin-bottom:2rem;line-height:1.5;}
        .details{background:#f3f4f6;padding:1.2rem;margin:1.5rem 0;border-radius:8px;text-align:left;font-size:0.85rem;color:#4b5563;}
        .details p{margin:0.4rem 0;}
        .btn{display:inline-block;padding:0.8rem 1.8rem;background:#dc2626;color:white;text-decoration:none;border-radius:8px;margin-top:1rem;font-size:0.9rem;font-weight:500;transition:background 0.2s;}
        .btn:hover{background:#b91c1c;}
    </style>
</head>
<body>
    <div class="card">
        <div class="error-code" th:text="${status ?: '404'}">404</div>
        <h2 class="error-title">PÁGINA NO ENCONTRADA</h2>
        <p class="error-subtitle">Lo sentimos, la página que buscas no esta disponible.</p>
        
        <div class="details">
            <p><strong>Timestamp:</strong> <span th:text="${timestamp}"></span></p>
            <p><strong>Path:</strong> <span th:text="${path}"></span></p>
            <p th:if="${message}"><strong>Mensaje:</strong> <span th:text="${message}"></span></p>
        </div>
        
        <a href="/" class="btn">VOLVER AL INICIO</a>
    </div>
</body>
</html>
